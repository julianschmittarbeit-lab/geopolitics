<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEOPOLIS</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <!-- Start screen (New Game / Continue / Import). Shown first, then hidden. -->
    <div id="start-screen" aria-label="Start"></div>

    <!-- Main app shell from DESIGN section 8: top bar, map + context panel,
         queued-actions tray, event log. Hidden until a game is started. -->
    <div id="app" class="hidden">
      <header id="topbar" aria-label="Status bar"></header>
      <main id="stage">
        <section id="map" aria-label="World map"></section>
        <aside id="context-panel" aria-label="Context panel"></aside>
      </main>
      <div id="queue-bar" aria-label="Queued actions"></div>
      <footer id="log" aria-label="Event log"></footer>
    </div>

    <!-- Transient toast notice + modal mount point. -->
    <div id="notice" aria-live="polite"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
